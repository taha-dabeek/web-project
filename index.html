<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Tiny Web Service</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>CHANGE THIS TITLE</h1>
    <p>CHANGE THIS: one short line about your topic.</p>
  </header>

  <main>
    <!-- You may change the look of this page freely.
         Do NOT change these four id values: q, go, status, results.
         The marking program looks for them. -->

    <label for="q">Search</label>
    <input type="search" id="q" placeholder="Type a word">
    <button id="go" type="button">Search</button>

    <p id="status"></p>

    <ul id="results"></ul>
  </main>

  <footer>
    <p>CHANGE THIS: your name and student number.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
